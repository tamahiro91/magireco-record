<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マギレコ記録">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>マギレコ実戦記録</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #1c1c1e;
    --panel2: #2c2c2e;
    --border: #3a3a3c;
    --text: #f2f2f7;
    --sub: #9a9aa0;
    --accent: #ffd60a;
    --big: #ff6b6b;
    --reg: #6bb8ff;
    --charge: #b98bff;
    --at: #6bffb0;
    --memo: #9a9aa0;
    --danger: #ff453a;
    --kuroe: #7a8cff;
    --epibo: #ffb454;
    --hikimodoshi: #ff2d95;
    --chokugeki: #ff6bb8;
    --band-blue: #4dabf7;
    --band-yellow: #ffe066;
    --band-green: #51cf66;
    --band-red: #fa5252;
    --embryo: #4ecdc4;
    --doppel: #9775fa;
    --arina: #94d82d;
    --true-ending: #f0c987;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 14px 90px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  #view-list header { margin-bottom: 2px; }
  .app-version { font-size: 11px; color: var(--sub); margin-bottom: 12px; }
  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    flex: 1;
  }
  .icon-btn {
    background: var(--panel2);
    border: none;
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 15px;
    cursor: pointer;
  }
  .icon-btn:active { opacity: 0.6; }
  .primary-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .primary-btn:active { opacity: 0.7; }
  .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
  }

  /* 全体集計 */
  .summary {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary .card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .summary .card .label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .summary .card .value { font-size: 18px; font-weight: 700; }
  .summary .card .sub { font-size: 11px; color: var(--sub); margin-top: 2px; white-space: nowrap; }
  .summary .calendar-btn { flex: 0 0 56px; font-size: 22px; }
  .global-stats-scroll { overflow-x: auto; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }

  /* カレンダー */
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
  .calendar-nav .icon-btn { font-size: 20px; padding: 6px 16px; }
  .calendar-month-label { font-size: 17px; font-weight: 700; }
  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 6px;
  }
  /* グリッドのauto行サイズは空セル(コンテンツなし)の高さを正しく計算しないことがあるため、
     行の高さはaspect-ratio/padding手法に頼らず固定pxで確保する */
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 48px; gap: 4px; }
  .calendar-day {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: var(--panel);
    font-size: 14px;
    cursor: default;
  }
  .calendar-day.empty { background: transparent; }
  .calendar-day.has-record { cursor: pointer; }
  .calendar-day.has-record:active { background: var(--panel2); }
  .calendar-day.today { border: 1px solid var(--accent); }
  .calendar-day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 3px; }
  .global-stats-row { display: flex; gap: 10px; }
  .global-stat-col {
    flex: 1 1 0;
    min-width: 70px;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }
  .global-stat-col .label { font-size: 11px; color: var(--sub); margin-bottom: 4px; white-space: nowrap; }
  .global-stat-col .value { font-size: 18px; font-weight: 700; }
  .global-stat-col .sub { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; }

  .search-row { margin-bottom: 12px; }
  .search-row input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
  }

  /* 来店カード一覧 */
  .visit-card {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .visit-card:active { opacity: 0.7; }
  .visit-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .visit-card .store { font-size: 17px; font-weight: 700; }
  .visit-card .date { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .visit-card .meta { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .visit-card .game-line { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 8px; }
  .visit-card .prob-grid { display: flex; margin-top: 8px; }
  .visit-card .prob-col { flex: 1; text-align: center; min-width: 0; }
  .visit-card .prob-col .p-label { font-size: 10px; color: var(--sub); white-space: nowrap; }
  .visit-card .prob-col .p-count { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .visit-card .prob-col .p-percent { font-size: 12px; color: var(--sub); margin-top: 2px; }

  .counters { display: flex; gap: 8px; margin-top: 10px; }
  .counter-card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--panel2);
    border-radius: 12px;
    padding: 8px 4px;
  }
  .counter-card .counter-label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; white-space: nowrap; }
  .counter-controls { display: flex; align-items: center; gap: 6px; }
  .counter-controls .counter-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 9px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    padding: 0;
  }
  .counter-controls .counter-btn:active { opacity: 0.6; }
  .counter-value { font-size: 18px; font-weight: 700; min-width: 20px; text-align: center; }

  .empty {
    text-align: center;
    color: var(--sub);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.8;
  }

  /* 詳細ビュー */
  .visit-header {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .visit-header .store { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .visit-header .sub { font-size: 13px; color: var(--sub); }
  .visit-header .actions { display: flex; gap: 8px; margin-top: 10px; }
  .visit-header .summary .card { padding: 8px 4px; }
  .visit-header .summary .label { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .visit-header .summary .value { font-size: 22px; }
  .visit-header .summary .prob,
  .counter-card .prob { font-size: 10px; color: var(--sub); margin-top: 3px; white-space: nowrap; }
  .visit-header .summary .card:nth-child(1) { background: rgba(255, 107, 107, 0.16); border: 1px solid rgba(255, 107, 107, 0.45); }
  .visit-header .summary .card:nth-child(1) .label,
  .visit-header .summary .card:nth-child(1) .value { color: var(--big); }
  .visit-header .summary .card:nth-child(2) { background: rgba(185, 139, 255, 0.16); border: 1px solid rgba(185, 139, 255, 0.45); }
  .visit-header .summary .card:nth-child(2) .label,
  .visit-header .summary .card:nth-child(2) .value { color: var(--charge); }
  .visit-header .summary .card:nth-child(3) { background: rgba(255, 214, 10, 0.14); border: 1px solid rgba(255, 214, 10, 0.45); }
  .visit-header .summary .card:nth-child(3) .label,
  .visit-header .summary .card:nth-child(3) .value { color: var(--accent); }
  .visit-header .summary .card:nth-child(4) { background: rgba(107, 255, 176, 0.14); border: 1px solid rgba(107, 255, 176, 0.45); }
  .visit-header .summary .card:nth-child(4) .label,
  .visit-header .summary .card:nth-child(4) .value { color: var(--at); }

  .visit-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .visit-game { flex-shrink: 0; text-align: right; white-space: nowrap; margin-right: 6px; }
  .visit-game-label { font-size: 11px; color: var(--sub); }
  .visit-game-value { font-size: 24px; font-weight: 800; color: var(--text); margin-top: 2px; }

  .invest-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 10px;
    background: var(--panel2);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .invest-rate-wrap { position: relative; flex-shrink: 0; }
  .invest-rate-wrap::after {
    content: '▾';
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--sub);
    pointer-events: none;
  }
  .invest-rate {
    -webkit-appearance: none;
    appearance: none;
    height: 34px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0 22px 0 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .invest-stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .mini-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    padding: 0;
  }
  .mini-btn:active { opacity: 0.6; }
  .invest-count { font-size: 15px; font-weight: 700; min-width: 18px; text-align: center; }
  .invest-unit { font-size: 13px; color: var(--sub); flex-shrink: 0; }
  .invest-total {
    padding-left: 10px;
    border-left: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .invest-total-label { font-size: 11px; font-weight: 400; color: var(--sub); }

  .entry {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .entry .tag {
    flex-shrink: 0;
    box-sizing: border-box;
    width: 72px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 999px;
    color: #000;
    white-space: nowrap;
    margin-top: 1px;
  }
  .tag.BIG { background: var(--big); }
  .tag.みたま { background: var(--charge); }
  .tag.マギアCZ { background: var(--reg); }
  .tag.黒江CZ { background: var(--kuroe); }
  .tag.エピボ { background: var(--epibo); }
  .tag.引戻し { background: var(--hikimodoshi); }
  .tag.at直撃 { background: var(--chokugeki); }
  .tag.エンブリオ { background: var(--embryo); font-size: 8px; }
  .tag.ドッペル { background: var(--doppel); }
  .tag.アリナ { background: var(--arina); }
  .tag.TrueEnding { background: var(--true-ending); font-size: 8px; }
  .tag.AT { background: var(--at); }
  .tag.メモ { background: var(--memo); color: #000; }
  .entry .entry-num { flex-shrink: 0; width: 16px; text-align: center; font-size: 13px; font-weight: 700; color: var(--sub); margin-top: 4px; }
  .entry .tags { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .entry .body { flex: 1; min-width: 0; }
  .entry .nums { font-size: 15px; font-weight: 700; }
  .entry .mode { font-size: 13px; color: var(--accent); margin-top: 2px; }
  .entry .extra { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .entry .extra div { margin-top: 1px; word-break: break-word; }
  .entry .extra .extra-small { font-size: 9.5px; white-space: nowrap; }
  .entry .note { font-size: 13px; color: var(--sub); margin-top: 2px; word-break: break-word; white-space: pre-wrap; }
  .entry .drag-handle {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--sub);
    font-size: 18px;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .entry.dragging {
    position: relative;
    z-index: 50;
    opacity: 0.9;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
  }

  .fab {
    position: fixed;
    right: max(20px, calc((100vw - 640px) / 2 + 20px));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-size: 28px;
    border: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 10;
  }
  .fab:active { opacity: 0.7; }

  /* モーダル */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-end;
    z-index: 100;
    touch-action: none;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px 0;
    max-height: 88vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  body.modal-open { overflow: hidden; }
  .sheet h2 { margin: 0 0 14px; font-size: 17px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 44px; overflow-y: hidden; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .cat-select { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-select button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .cat-select button.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .band-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .band-select { display: flex; gap: 8px; flex-wrap: wrap; }
  .band-select button {
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: #000;
  }
  .band-select button[data-v="青"] { background: var(--band-blue); }
  .band-select button[data-v="黄"] { background: var(--band-yellow); }
  .band-select button[data-v="緑"] { background: var(--band-green); }
  .band-select button[data-v="赤"] { background: var(--band-red); color: #fff; }
  .band-select button[data-v="虹"] { background: linear-gradient(90deg, #fa5252, #ffe066, #51cf66, #4dabf7, #b98bff); }
  .band-select button[data-v="白"] { background: #ffffff; }
  .band-select button.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .band-bonus { display: flex; align-items: center; gap: 6px; }
  .band-bonus input {
    width: 80px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .band-bonus span { font-size: 13px; color: var(--sub); }
  .wee-chance-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .wee-chance-card .wee-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .wee-chance-card .field { margin-bottom: 10px; }
  .wee-chance-card .field:last-child { margin-bottom: 0; }
  .wee-chance-card .field label { font-size: 12px; }
  .wee-chance-card .field-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .wee-chance-card .field-row .field { flex: 1; margin-bottom: 0; min-width: 0; }
  .wee-chance-delete { color: var(--danger); border-color: var(--danger); width: 100%; margin-top: 4px; }
  .picker-trigger {
    width: 100%;
    text-align: left;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .picker-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .picker-option {
    text-align: left;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    cursor: pointer;
  }
  .picker-option.active { border-color: var(--accent); color: var(--accent); }
  .picker-option-with-img { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  .picker-option-with-img img { height: 32px; width: 40px; object-fit: cover; border-radius: 4px; flex-shrink: 0; display: block; }
  .picker-option-with-img span { flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion-box {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--accent);
  }
  .suggestion-summary { margin-top: 12px; }
  .suggestion-summary-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .suggestion-summary-toggle .chevron { color: var(--sub); transition: transform 0.15s; }
  .suggestion-summary.closed .suggestion-summary-toggle .chevron { transform: rotate(-90deg); }
  .suggestion-summary.closed .suggestion-summary-body { display: none; }
  .suggestion-summary-body {
    margin-top: 8px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 14px;
  }
  .suggestion-group { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .suggestion-group:last-child, .suggestion-simple-row:last-child { border-bottom: none; }
  .suggestion-group-title { font-size: 12px; color: var(--sub); font-weight: 700; margin-bottom: 4px; }
  .suggestion-line { font-size: 13px; color: var(--accent); line-height: 1.6; }
  .suggestion-simple-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
  }
  .suggestion-empty { font-size: 13px; color: var(--sub); padding: 10px 0; text-align: center; }
  .card-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .card-count-item {
    width: 104px;

  // 旧名称(「マギチャレ当選」「マギCZ」)は新名称「マギアCZ」に読み替える
  function renameOldResults(results) {

  function normalizeEntry(e) {
    if (Array.isArray(e.results)) {
      e.results = renameOldResults(e.results);
      // 当選契機が単一選択(文字列)だった旧形式を複数選択(配列)に変換する
      if (!Array.isArray(e.embryoTriggers)) {
        e.embryoTriggers = e.embryoTrigger ? [e.embryoTrigger] : [];
        delete e.embryoTrigger;
      }
      // ドッペルの内容が単一項目だった旧形式を繰り返しリスト(配列)に変換する
      if (!Array.isArray(e.doppelChances)) {
        if (e.doppelType || (e.doppelTriggers && e.doppelTriggers.length) || typeof e.doppelBonus === 'number' || e.doppelPattern) {
          e.doppelChances = [{
            id: uid(), doppelType: e.doppelType || null, triggers: e.doppelTriggers || [],
            bonusGame: (typeof e.doppelBonus === 'number') ? e.doppelBonus : null, pattern: e.doppelPattern || null
          }];
        } else {
          e.doppelChances = [];
        }
        delete e.doppelType; delete e.doppelTriggers; delete e.doppelBonus; delete e.doppelPattern;
      }
      // うぃチャンスの種別「ノーマル」だった旧名称を「ストーリー」に移行する
      if (Array.isArray(e.weeChances)) {
        e.weeChances.forEach(function (c) {
          if (c.storyType === 'ノーマル') c.storyType = 'ストーリー';
        });
      }
      // エンディング中のカードが選択式リストだった旧形式を{カード名: 回数}の形式に変換する
      if (Array.isArray(e.cardChances)) {
        var cardCounts = {};
        e.cardChances.forEach(function (c) {
          if (c.cardName) cardCounts[c.cardName] = (cardCounts[c.cardName] || 0) + 1;
        });
        e.cardCounts = cardCounts;
        delete e.cardChances;
      }
      return e;
    }

    var results = [];
    if (e.result) {
      results = [e.result];
    } else if (e.cat === 'BIG' || e.cat === 'REG') {
      results = ['BIG'];
    } else if (e.cat === 'マギチャレ成功') {
      results = ['みたま'];
    }
    results = renameOldResults(results);

    return {
      id: e.id,
      game: (e.game !== undefined) ? e.game : ((typeof e.g === 'number') ? e.g : null),
      point: (e.point !== undefined) ? e.point : ((typeof e.p === 'number') ? e.p : null),

      atWin: (e.atWin !== undefined) ? e.atWin : (e.cat === 'AT当選'),
      atMemo: (e.atMemo !== undefined) ? e.atMemo : (e.note || '')
    };
  }

  // --- クラウド同期(Firebase Firestore) ---
  var SYNC_CODE_KEY = 'magireco.syncCode';
  var syncCode = localStorage.getItem(SYNC_CODE_KEY) || null;
  var syncUnsubscribe = null;
  var firebaseReady = false;
  var pendingSyncStart = null;

  window.addEventListener('mgr-firebase-ready', function () {
    firebaseReady = true;
    if (syncCode) {
      listenSync();
    }
    if (pendingSyncStart) {
      var code = pendingSyncStart;
      pendingSyncStart = null;
      startSync(code);
    }
  });

  function syncDocRef(code) {
    return window.__mgrSync.doc(window.__mgrSync.db, 'syncs', code);
  }

  function setSyncStatus(text) {
    var el = document.getElementById('sync-status');
    if (el) el.textContent = text;
  }

  function pushToCloud() {
    if (!syncCode || !firebaseReady) return;
    window.__mgrSync.setDoc(syncDocRef(syncCode), {
      visits: state.visits,
      updatedAt: Date.now()
    }).catch(function () {
      setSyncStatus('同期エラー: クラウドへの保存に失敗しました');
    });
  }

  function listenSync() {
    if (syncUnsubscribe) { syncUnsubscribe(); syncUnsubscribe = null; }
    if (!syncCode || !firebaseReady) return;
    syncUnsubscribe = window.__mgrSync.onSnapshot(syncDocRef(syncCode), function (snap) {
      if (!snap.exists()) return;
      state.visits = snap.data().visits || [];
      state.visits.forEach(function (v) { v.entries = (v.entries || []).map(normalizeEntry); });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.visits));
      if (!elDetailView.hidden) { renderDetail(); } else { renderList(); }
      setSyncStatus('同期コード「' + syncCode + '」で同期中');
    }, function () {
      setSyncStatus('同期エラー: クラウドに接続できませんでした');
    });
    setSyncStatus('同期コード「' + syncCode + '」で同期中');
  }

  function startSync(code) {
    if (!firebaseReady) {
      pendingSyncStart = code;
      setSyncStatus('接続中です…もう少しお待ちください');
      return;
    }
    syncCode = code;
    localStorage.setItem(SYNC_CODE_KEY, code);
    setSyncStatus('接続中…');
    window.__mgrSync.getDoc(syncDocRef(code)).then(function (snap) {
      var cloudVisits = snap.exists() ? (snap.data().visits || []) : [];
      var localHasData = state.visits.length > 0;
      var cloudHasData = cloudVisits.length > 0;
      if (cloudHasData && localHasData) {
        if (confirm('クラウドにも記録があります。クラウド側のデータを使いますか?\n(OK: クラウドを使う / キャンセル: 今の端末のデータでクラウドを上書き)')) {
          state.visits = cloudVisits;
          state.visits.forEach(function (v) { v.entries = (v.entries || []).map(normalizeEntry); });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.visits));
          renderList();
        } else {
          pushToCloud();
        }
      } else if (cloudHasData) {
        state.visits = cloudVisits;
        state.visits.forEach(function (v) { v.entries = (v.entries || []).map(normalizeEntry); });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.visits));
        renderList();
      } else {
        pushToCloud();
      }
      listenSync();
    }).catch(function () {
      setSyncStatus('同期エラー: クラウドに接続できませんでした');
    });
  }

  function stopSync() {
    if (syncUnsubscribe) { syncUnsubscribe(); syncUnsubscribe = null; }
    syncCode = null;
    localStorage.removeItem(SYNC_CODE_KEY);
    setSyncStatus('同期を解除しました');
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(s) {
    if (!s) return '';
    var p = s.split('-');
    return p.length === 3 ? p[0] + '/' + p[1] + '/' + p[2] : s;
  }
  // 分母÷回数を「1/xxx.x」の確率表記にする(回数が0の時は空欄)
  function fmtProb(total, count) {
    if (!count) return '';
    return '1/' + (total / count).toFixed(1);
  }
  // 回数÷分母を「xx.x%」のパーセント表記にする(分母が0の時は空欄)
  function fmtPercent(count, base) {
    if (!base) return '';
    return (count / base * 100).toFixed(1) + '%';
  }
  function visitStats(visit) {
    var point = 0, hits = 0, big = 0, mitama = 0, atWin = 0, game = 0;
    (visit.entries || []).forEach(function (e) {
      if (typeof e.point === 'number') point += e.point;
      if (typeof e.game === 'number') game += e.game;
      if (e.results && e.results.length) hits++;
      if (e.results && (e.results.indexOf('BIG') !== -1 || e.results.indexOf('エピボ') !== -1)) big++;
      if (e.results && e.results.indexOf('みたま') !== -1) mitama++;
      if (e.atWin) atWin++;
    });
    return { point: point, hits: hits, count: (visit.entries || []).length, big: big, mitama: mitama, total: big + mitama, atWin: atWin, game: game };
  }

  var EMBRYO_PATTERN_TEXT = {};
  EMBRYO_PATTERN_OPTIONS.forEach(function (o) { if (o.v) EMBRYO_PATTERN_TEXT[o.v] = o.text; });

  // 来店1日分のエントリーから、各種示唆情報を集計する(示唆一覧セクション用)
  function visitSuggestionSummary(visit) {
    var bigScreen = {}, atScreen = {}, epibo = {}, cards = {}, storyOrder = {}, embryoPattern = {};
    var hikimodoshi = 0, atChokugeki = 0;
    (visit.entries || []).forEach(function (e) {
      if (e.bigScreen) {
        var bsLabel = e.bigScreen + (BIG_SCREEN_SUGGESTION[e.bigScreen] ? '(' + BIG_SCREEN_SUGGESTION[e.bigScreen] + ')' : '');
        bigScreen[bsLabel] = (bigScreen[bsLabel] || 0) + 1;
      }
      if (e.atScreen) {
        var asLabel = e.atScreen + '(' + AT_SCREEN_SUGGESTION[e.atScreen] + ')';
        atScreen[asLabel] = (atScreen[asLabel] || 0) + 1;
      }
      var epiboText = epiboSuggestionText(e.epiboChar, e.epiboKuroeCase);
      if (e.epiboChar && epiboText) {
        var epiboLabel = e.epiboChar + (e.epiboChar === '黒江' && e.epiboKuroeCase ? '(' + e.epiboKuroeCase + ')' : '') + '(' + epiboText + ')';
        epibo[epiboLabel] = (epibo[epiboLabel] || 0) + 1;
      }
      if (e.cardCounts) {
        Object.keys(e.cardCounts).forEach(function (name) {
          var n = e.cardCounts[name];
          if (!n) return;
          var cardInfo = EMBRYO_CARD_LIST.find(function (c) { return c.name === name; });
          var cardLabel = cardInfo ? cardListSuggestionLabel(cardInfo.suggestion) : name;
          cards[cardLabel] = (cards[cardLabel] || 0) + n;
        });
      }
      if (e.storyOrderPattern) {
        var soLabel = storyOrderShortLabel(e.storyOrderPattern);
        storyOrder[soLabel] = (storyOrder[soLabel] || 0) + 1;
      }
      if (e.embryoPattern) {
        var epLabel = EMBRYO_PATTERN_TEXT[e.embryoPattern] || e.embryoPattern;
        embryoPattern[epLabel] = (embryoPattern[epLabel] || 0) + 1;
      }
      if (e.weeChances && e.weeChances.length) {
        e.weeChances.forEach(function (c) {
          if (!c.settingPattern) return;
          var wpLabel = EMBRYO_PATTERN_TEXT[c.settingPattern] || c.settingPattern;
          embryoPattern[wpLabel] = (embryoPattern[wpLabel] || 0) + 1;
        });
      }
      if (e.results && e.results.indexOf('引戻し') !== -1) hikimodoshi++;
      if (e.results && e.results.indexOf('at直撃') !== -1) atChokugeki++;
    });
    function toList(map) {
      return Object.keys(map).map(function (label) { return { label: label, count: map[label] }; });
    }
    return {
      groups: [
        { title: 'BIG終了画面', items: toList(bigScreen) },
        { title: 'at終了画面', items: toList(atScreen) },
        { title: 'エピソードボーナスの示唆', items: toList(epibo) },
        { title: 'エンディング中のカード示唆', items: toList(cards) },
        { title: 'ストーリーの話数の示唆', items: toList(storyOrder) },
        { title: 'キャラ紹介の示唆', items: toList(embryoPattern) }
      ],
      hikimodoshi: hikimodoshi,
      atChokugeki: atChokugeki
    };
  }

  // スイカ/CZ/CZ成功のタップカウンター(来店ごとに保持)
  function changeCounter(key, delta) {
    var v = currentVisit();
    if (!v) return;
    if (!v.counters) v.counters = { suika: 0, cz: 0, czWin: 0 };
    v.counters[key] = Math.max(0, (v.counters[key] || 0) + delta);
    save();
    renderDetail();
  }
  document.getElementById('d-suika-plus').addEventListener('click', function () { changeCounter('suika', 1); });
  document.getElementById('d-suika-minus').addEventListener('click', function () { changeCounter('suika', -1); });
  document.getElementById('d-cz-plus').addEventListener('click', function () { changeCounter('cz', 1); });
  document.getElementById('d-cz-minus').addEventListener('click', function () { changeCounter('cz', -1); });
  document.getElementById('d-czwin-plus').addEventListener('click', function () { changeCounter('czWin', 1); });
  document.getElementById('d-czwin-minus').addEventListener('click', function () { changeCounter('czWin', -1); });

  function changeInvestCount(delta) {
    var v = currentVisit();
    if (!v) return;
    if (!v.invest) v.invest = { rate: 46, count: 0 };
    v.invest.count = Math.max(0, (v.invest.count || 0) + delta);

  // --- 遊技履歴カレンダー ---
  function openCalendar() {
    var today = new Date();

    state.calMonth = today.getMonth();
    elListView.hidden = true;
    elCalendarView.hidden = false;
    renderCalendar();
  }
  function closeCalendar() {
    elCalendarView.hidden = true;
    elListView.hidden = false;
  }
  function renderCalendar() {
    var year = state.calYear, month = state.calMonth;
    document.getElementById('cal-month-label').textContent = year + '年' + (month + 1) + '月';
    var visitsByDate = {};
    state.visits.forEach(function (v) {
      if (!v.date) return;
      (visitsByDate[v.date] = visitsByDate[v.date] || []).push(v);
    });
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var startWeekday = new Date(year, month, 1).getDay();
    var grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';
    for (var i = 0; i < startWeekday; i++) {
      var empty = document.createElement('div');
      empty.className = 'calendar-day empty';
      grid.appendChild(empty);
    }
    var todayStrVal = todayStr();
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var cell = document.createElement('div');
      cell.className = 'calendar-day';
      if (dateStr === todayStrVal) cell.classList.add('today');
      var num = document.createElement('div');
      num.textContent = d;
      cell.appendChild(num);
      var dayVisits = visitsByDate[dateStr];
      if (dayVisits && dayVisits.length) {
        cell.classList.add('has-record');
        var dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
        cell.addEventListener('click', function (visits) {
          return function () {
            if (visits.length === 1) {
              openDetail(visits[0].id);
            } else {
              var options = visits.map(function (v) { return { v: v.id, text: v.store || '(店舗名未設定)' }; });
              openPicker('来店を選択', options, '', function (id) { openDetail(id); });
            }
          };
        }(dayVisits));
      }
      grid.appendChild(cell);
    }
  }

  document.getElementById('btn-calendar-back').addEventListener('click', closeCalendar);

    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }

  document.getElementById('btn-cal-next').addEventListener('click', function () {

          if (c.pattern) extraLines.push(prefix + 'ストーリー設定示唆: ' + EMBRYO_ROMAN[c.pattern] + ' ' + EMBRYO_PATTERN_LEVEL[String(c.pattern)]);
        });
      }
      if (e.cardCounts) {
        var usedCardNames = Object.keys(e.cardCounts).filter(function (name) { return e.cardCounts[name] > 0; });
        if (usedCardNames.length) {
          extraLines.push('カード:');
          usedCardNames.forEach(function (name) {
            var cardInfo = EMBRYO_CARD_LIST.find(function (c) { return c.name === name; });

  // 記録の並び順を1つ前後に入れ替える(direction: -1で上へ、+1で下へ)
  // ハンドルを「タップ」すると削除、「ドラッグ」すると並び替え。
  // タップとドラッグは指の移動量で区別する。
  var dragState = null;
  var DRAG_THRESHOLD = 8;

  function startDrag(ev, visit, entryId, rowEl) {
    if (ev.touches.length !== 1) return;
    var touch = ev.touches[0];
    var rects = Array.prototype.map.call(elEntryList.children, function (child) {
      var r = child.getBoundingClientRect();
      return { id: child.dataset.entryId, top: r.top, bottom: r.bottom };
    });
    dragState = { visit: visit, entryId: entryId, rowEl: rowEl, startY: touch.clientY, moved: false, rects: rects };
    rowEl.classList.add('dragging');
    ev.preventDefault();
  }

  document.addEventListener('touchmove', function (ev) {
    if (!dragState) return;
    var touch = ev.touches[0];
    var deltaY = touch.clientY - dragState.startY;
    if (Math.abs(deltaY) > DRAG_THRESHOLD) dragState.moved = true;
    dragState.rowEl.style.transform = 'translateY(' + deltaY + 'px)';
    ev.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function (ev) {
    if (!dragState) return;
    var ds = dragState;
    dragState = null;
    ds.rowEl.classList.remove('dragging');
    ds.rowEl.style.transform = '';

    if (!ds.moved) {
      // 指をほぼ動かさなかった = タップとみなして削除確認を出す
      if (confirm('この記録を削除しますか？')) {
        ds.visit.entries = ds.visit.entries.filter(function (x) { return x.id !== ds.entryId; });
        save();
      }
      renderDetail();
      return;
    }

    var touch = ev.changedTouches[0];
    var others = ds.rects.filter(function (r) { return r.id !== ds.entryId; });
    var targetIndex = 0;
    others.forEach(function (r) {
      var center = (r.top + r.bottom) / 2;
      if (touch.clientY > center) targetIndex++;
    });
    var draggedEntry = ds.visit.entries.find(function (x) { return x.id === ds.entryId; });
    var rest = ds.visit.entries.filter(function (x) { return x.id !== ds.entryId; });
    rest.splice(targetIndex, 0, draggedEntry);
    ds.visit.entries = rest;
    save();
    renderDetail();
  });

  document.addEventListener('touchcancel', function () {
    if (!dragState) return;
    dragState.rowEl.classList.remove('dragging');
    dragState.rowEl.style.transform = '';
    dragState = null;
  });

    label.textContent = labelText;

      btn.type = 'button';
      btn.textContent = opt;
      if (opt === currentValue) btn.classList.add('active');
      btn.addEventListener('click', function () { onSelect(opt); });
      group.appendChild(btn);
    });
    field.appendChild(group);
    return field;
  }
  function buildNumberField(labelText, obj, key, placeholder) {
    var field = document.createElement('div');
    field.className = 'field';
    var label = document.createElement('label');
    label.textContent = labelText;
    field.appendChild(label);
    var input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'numeric';
    input.placeholder = placeholder;
    input.value = (typeof obj[key] === 'number') ? obj[key] : '';
    input.addEventListener('input', function () {
      obj[key] = input.value === '' ? null : Number(input.value);
    });
    field.appendChild(input);
    return field;
  }

    return field;
  }

        } else {
          card.appendChild(buildToggleField('ストーリー番号', WEE_NORMAL_NUMBERS, chance.normalNumber ? String(chance.normalNumber) : null, function (v) {
            chance.normalNumber = (String(chance.normalNumber) === v) ? null : Number(v);
            renderWeeChances();
          }));
        }
      } else if (chance.storyType === 'SP') {
        card.appendChild(buildToggleField('SP色', WEE_SP_COLORS, chance.spColor, function (v) {
          chance.spColor = (chance.spColor === v) ? null : v;

      } else if (chance.storyType === 'マギアボーナス') {
        card.appendChild(buildNumberField('うぃチャンスストック数', chance, 'magiaStock', '例: 3'));

      card.appendChild(buildConnectColorField(chance));

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'ghost-btn wee-chance-delete';
      delBtn.textContent = 'このうぃチャンスを削除';
      delBtn.addEventListener('click', function () {
        state.weeChances.splice(idx, 1);
        renderWeeChances();
      });
      card.appendChild(delBtn);

      weeChancesList.appendChild(card);
    });
  }
  document.getElementById('wee-chance-add').addEventListener('click', function () {
    state.weeChances.push(createEmptyWeeChance());
    renderWeeChances();
  });

  // 複数選択(トグル)のボタングループをその場で組み立てる版(ドッペルチャンスの当選契機で使う)
  function buildMultiToggleField(labelText, options, selectedArr, onToggle) {
    var field = document.createElement('div');
    field.className = 'field';
    var label = document.createElement('label');
    label.textContent = labelText;
    field.appendChild(label);
    var group = document.createElement('div');
    group.className = 'cat-select';
    options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = opt;
      if (selectedArr.indexOf(opt) !== -1) btn.classList.add('active');
      btn.addEventListener('click', function () { onToggle(opt); });
      group.appendChild(btn);
    });
    field.appendChild(group);
    return field;
  }
  // エンブリオの設定示唆(①〜⑨)と同じピッカーを、任意のオブジェクト/キーに対して使い回すヘルパー
  function buildPatternPickerField(labelText, obj, key, onSelect) {
    var field = document.createElement('div');
    field.className = 'field';
    var label = document.createElement('label');
    label.textContent = labelText;
    field.appendChild(label);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'picker-trigger';
    btn.textContent = embryoPatternShortLabel(obj[key]) + ' ▾';
    btn.addEventListener('click', function () {
      openPicker(labelText, EMBRYO_PATTERN_OPTIONS, obj[key] || '', function (v) {
        obj[key] = v || null;
        onSelect();
      });
    });
    field.appendChild(btn);
    return field;
  }
  var doppelChancesList = document.getElementById('doppel-chances-list');
  function renderDoppelChances() {
    doppelChancesList.innerHTML = '';
    state.doppelChances.forEach(function (chance, idx) {
      var card = document.createElement('div');
      card.className = 'wee-chance-card';
      var title = document.createElement('div');
      title.className = 'wee-title';
      title.textContent = 'ドッペルチャンス' + (idx + 1);
      card.appendChild(title);

      card.appendChild(buildToggleField('ドッペル種別', DOPPEL_TYPES, chance.doppelType, function (v) {
        chance.doppelType = (chance.doppelType === v) ? null : v;
        renderDoppelChances();
      }));

      card.appendChild(buildMultiToggleField('当選契機(複数選択可)', DOPPEL_TRIGGER_OPTIONS, chance.triggers, function (v) {
        var i = chance.triggers.indexOf(v);
        if (i === -1) { chance.triggers.push(v); } else { chance.triggers.splice(i, 1); }
        renderDoppelChances();
      }));

      card.appendChild(buildNumberField('ドッペル上乗せゲーム数', chance, 'bonusGame', '例: 30'));

      card.appendChild(buildPatternPickerField('ストーリー設定示唆', chance, 'pattern', renderDoppelChances));

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'ghost-btn wee-chance-delete';
      delBtn.textContent = 'このドッペルチャンスを削除';
      delBtn.addEventListener('click', function () {
        state.doppelChances.splice(idx, 1);
        renderDoppelChances();
      });
      card.appendChild(delBtn);

      doppelChancesList.appendChild(card);
    });
  }
  document.getElementById('doppel-chance-add').addEventListener('click', function () {
    state.doppelChances.push(createEmptyDoppelChance());
    renderDoppelChances();
  });

  // エンディング中に出現したカードの記録(12種固定グリッド、カードごとに+/-カウンター)
  var cardChancesGrid = document.getElementById('card-chances-grid');
  function renderCardChances() {
    cardChancesGrid.innerHTML = '';
    EMBRYO_CARD_LIST.forEach(function (c) {
      var item = document.createElement('div');
      item.className = 'card-count-item';

      var img = document.createElement('img');
      img.src = c.img;
      img.alt = c.name;
      item.appendChild(img);

      var name = document.createElement('div');
      name.className = 'card-name';
      name.textContent = c.name;
      item.appendChild(name);

      var suggestion = document.createElement('div');
      suggestion.className = 'card-suggestion';
      suggestion.textContent = c.suggestion;
      item.appendChild(suggestion);

      var counter = document.createElement('div');
      counter.className = 'card-counter';
      var minusBtn = document.createElement('button');
      minusBtn.type = 'button';
      minusBtn.textContent = '－';
      var countValue = document.createElement('span');
      countValue.className = 'count-value';
      countValue.textContent = state.cardCounts[c.name] || 0;
      var plusBtn = document.createElement('button');
      plusBtn.type = 'button';
      plusBtn.textContent = '＋';
      minusBtn.addEventListener('click', function () {
        var v = Math.max(0, (state.cardCounts[c.name] || 0) - 1);
        if (v === 0) { delete state.cardCounts[c.name]; } else { state.cardCounts[c.name] = v; }
        countValue.textContent = v;
      });
      plusBtn.addEventListener('click', function () {
        var v = (state.cardCounts[c.name] || 0) + 1;
        state.cardCounts[c.name] = v;
        countValue.textContent = v;
      });
      counter.appendChild(minusBtn);
      counter.appendChild(countValue);
      counter.appendChild(plusBtn);
      item.appendChild(counter);

      cardChancesGrid.appendChild(item);
    });
  }

  // 単一選択(もう一度押すと選択解除)のボタングループを作る共通ヘルパー
  // onChangeを渡すと選択が変わるたびに呼び出す(条件付き表示の再判定などに使う)
  function setupSingleSelect(selector, stateKey, onChange) {
    var buttons = document.querySelectorAll(selector);
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state[stateKey] = (state[stateKey] === btn.dataset.v) ? null : btn.dataset.v;
        buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state[stateKey]); });
        if (onChange) onChange();
      });
    });
    return buttons;
  }
  var bandButtons = setupSingleSelect('#e-band button', 'selectedBand');
  var embryoBellButtons = setupSingleSelect('#e-embryo-bell button', 'selectedEmbryoBell');
  var embryoConnectButtons = setupSingleSelect('#e-embryo-connect button', 'selectedEmbryoConnect');
  var epiboCharButtons = setupSingleSelect('#e-epibo-char button', 'selectedEpiboChar', function () { updateConditionalFields(); });
  var epiboKuroeCaseButtons = setupSingleSelect('#e-epibo-kuroe-case button', 'selectedEpiboKuroeCase', function () { updateConditionalFields(); });

  // 複数選択(ON/OFFをそれぞれ独立して切り替え)のボタングループを作る共通ヘルパー
  function setupMultiSelect(selector, stateKey, onChange) {
    var buttons = document.querySelectorAll(selector);
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var v = btn.dataset.v;
        var idx = state[stateKey].indexOf(v);
        if (idx === -1) {
          state[stateKey].push(v);
        } else {
          state[stateKey].splice(idx, 1);
        }
        btn.classList.toggle('active', state[stateKey].indexOf(v) !== -1);
        if (onChange) onChange();
      });
    });
    return buttons;
  }
  var embryoTriggerButtons = setupMultiSelect('#e-embryo-trigger button', 'selectedEmbryoTriggers', function () { updateConditionalFields(); });

  function openEntrySheet(entryId) {
    state.editingEntryId = entryId || null;
    var title = document.getElementById('entry-sheet-title');
    if (entryId) {
      var v = currentVisit();
      var e = v.entries.find(function (x) { return x.id === entryId; });
      title.textContent = '記録を編集';
      state.selectedResults = (e.results || []).slice();
      state.selectedMode = e.mode || null;
      state.selectedBigVoice = e.bigVoice || null;
      state.selectedBigScreen = e.bigScreen || null;
      state.selectedAtScreen = e.atScreen || null;
      state.selectedBand = e.bandColor || null;
      state.doppelChances = (e.doppelChances || []).map(function (c) { return Object.assign({}, c, { triggers: (c.triggers || []).slice() }); });
      state.cardCounts = Object.assign({}, e.cardCounts || {});
      state.selectedEpiboChar = e.epiboChar || null;
      state.selectedEpiboKuroeCase = e.epiboKuroeCase || null;
      state.selectedEmbryoTriggers = (e.embryoTriggers || []).slice();
      state.selectedEmbryoBell = (e.embryoBellLevel != null) ? String(e.embryoBellLevel) : null;
      state.selectedEmbryoConnect = e.embryoConnect || null;
      eGame.value = (typeof e.game === 'number') ? e.game : '';
      ePoint.value = (typeof e.point === 'number') ? e.point : '';
      eAtStartGame.value = (typeof e.atStartGame === 'number') ? e.atStartGame : '';
      eStartGame.value = (typeof e.startGame === 'number') ? e.startGame : '';
      eBandBonus.value = (typeof e.bandBonus === 'number') ? e.bandBonus : '';
      eEmbryoGameCount.value = (typeof e.embryoGameCount === 'number') ? e.embryoGameCount : '';
      eEmbryoBonus.value = (typeof e.embryoBonus === 'number') ? e.embryoBonus : '';
      eEmbryoConnectBonus.value = (typeof e.embryoConnectBonus === 'number') ? e.embryoConnectBonus : '';
      state.selectedEmbryoPattern = e.embryoPattern ? String(e.embryoPattern) : null;
      state.weeChances = (e.weeChances || []).map(function (c) { return Object.assign({}, c); });
      state.selectedStoryOrder = e.storyOrderPattern || null;
      eAtWin.checked = !!e.atWin;
      eAtMemo.value = e.atMemo || '';
      eDeleteBtn.style.display = '';
    } else {
      title.textContent = '記録を追加';
      state.selectedResults = [];
      state.selectedMode = null;
      state.selectedBigVoice = null;
      state.selectedBigScreen = null;
      state.selectedAtScreen = null;
      state.selectedBand = null;
      state.doppelChances = [];
      state.cardCounts = {};
      state.selectedEpiboChar = null;
      state.selectedEpiboKuroeCase = null;
      state.selectedEmbryoTriggers = [];
      state.selectedEmbryoBell = null;
      state.selectedEmbryoConnect = null;
      eGame.value = '';
      ePoint.value = '';
      eAtStartGame.value = '';
      eStartGame.value = '';
      eBandBonus.value = '';
      eEmbryoGameCount.value = '';
      eEmbryoBonus.value = '';
      eEmbryoConnectBonus.value = '';
      state.selectedEmbryoPattern = null;
      state.weeChances = [];
      state.selectedStoryOrder = null;
      eAtWin.checked = false;
      eAtMemo.value = '';
      eDeleteBtn.style.display = 'none';
    }
    resultButtons.forEach(function (b) { b.classList.toggle('active', state.selectedResults.indexOf(b.dataset.v) !== -1); });
    bandButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedBand); });
    embryoTriggerButtons.forEach(function (b) { b.classList.toggle('active', state.selectedEmbryoTriggers.indexOf(b.dataset.v) !== -1); });
    embryoBellButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedEmbryoBell); });
    embryoConnectButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedEmbryoConnect); });
    epiboCharButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedEpiboChar); });
    epiboKuroeCaseButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedEpiboKuroeCase); });
    eModeTrigger.textContent = modeShortText(state.selectedMode) + ' ▾';
    eEmbryoPatternTrigger.textContent = embryoPatternShortLabel(state.selectedEmbryoPattern) + ' ▾';
    eBigVoiceTrigger.textContent = bigVoiceFullLabel(state.selectedBigVoice, eAtWin.checked) + ' ▾';
    eBigScreenTrigger.textContent = bigScreenFullLabel(state.selectedBigScreen) + ' ▾';
    eAtScreenTrigger.textContent = atScreenFullLabel(state.selectedAtScreen) + ' ▾';
    eStoryOrderTrigger.textContent = storyOrderShortLabel(state.selectedStoryOrder) + ' ▾';
    renderWeeChances();
    renderDoppelChances();
    updateConditionalFields();
    overlayEntry.classList.remove('hidden');
    autoResizeTextarea(eAtMemo);
  }
  document.getElementById('e-cancel').addEventListener('click', function () {
    overlayEntry.classList.add('hidden');
  });
  document.getElementById('e-save').addEventListener('click', function () {
    var v = currentVisit();
    if (!v) return;
    var game = eGame.value === '' ? null : Number(eGame.value);
    var point = ePoint.value === '' ? null : Number(ePoint.value);
    var atStartGame = eAtStartGame.value === '' ? null : Number(eAtStartGame.value);
    var results = state.selectedResults.slice();
    var mode = state.selectedMode;
    var atWin = eAtWin.checked;
    var atMemo = eAtMemo.value.trim();
    // BIGが選ばれていない/at当選がOFFの時は、関連する選択を保存しない(表示と矛盾しないように)
    var hasBig = results.indexOf('BIG') !== -1;
    var bigVoice = hasBig ? state.selectedBigVoice : null;
    var bigScreen = hasBig ? state.selectedBigScreen : null;
    var atScreen = atWin ? state.selectedAtScreen : null;
    // 帯色・初期ゲーム数・エンブリオが選ばれていない時は関連する選択を保存しない(表示と矛盾しないように)
    var hasEmbryo = results.indexOf('エンブリオ') !== -1;
    var hasArina = results.indexOf('アリナ') !== -1;
    var startGame = (hasEmbryo || hasArina) ? (eStartGame.value === '' ? null : Number(eStartGame.value)) : null;
    var bandColor = hasEmbryo ? state.selectedBand : null;
    var bandBonus = hasEmbryo ? (eBandBonus.value === '' ? null : Number(eBandBonus.value)) : null;
    var embryoTriggers = hasEmbryo ? state.selectedEmbryoTriggers.slice() : [];
    var hasAnyTrigger = embryoTriggers.length > 0;
    var isKamihama = embryoTriggers.indexOf('神浜当選') !== -1;
    var embryoGameCount = hasAnyTrigger ? (eEmbryoGameCount.value === '' ? null : Number(eEmbryoGameCount.value)) : null;
    var embryoBellLevel = isKamihama && state.selectedEmbryoBell ? Number(state.selectedEmbryoBell) : null;
    var embryoBonus = isKamihama ? (eEmbryoBonus.value === '' ? null : Number(eEmbryoBonus.value)) : null;
    var embryoConnect = hasEmbryo ? state.selectedEmbryoConnect : null;
    var embryoConnectBonus = hasEmbryo ? (eEmbryoConnectBonus.value === '' ? null : Number(eEmbryoConnectBonus.value)) : null;
    var embryoPattern = hasEmbryo && state.selectedEmbryoPattern ? Number(state.selectedEmbryoPattern) : null;
    // うぃチャンスはat当選またはエンブリオ選択時のみ保存し、ストーリー順番示唆はat当選がOFFの時は保存しない
    var weeChances = (atWin || hasEmbryo) ? state.weeChances.map(function (c) { return Object.assign({}, c); }) : [];
    var storyOrderPattern = atWin ? state.selectedStoryOrder : null;
    // ドッペルが選ばれていない時はドッペル関連の項目を保存しない
    var hasDoppel = results.indexOf('ドッペル') !== -1;
    var doppelChances = hasDoppel ? state.doppelChances.map(function (c) { return Object.assign({}, c, { triggers: (c.triggers || []).slice() }); }) : [];
    // エンブリオが選ばれていない時はエンディング中のカードの記録も保存しない
    var cardCounts = hasEmbryo ? Object.assign({}, state.cardCounts) : {};
    // エピボが選ばれていない時はキャラクター関連の項目を保存しない
    var hasEpibo = results.indexOf('エピボ') !== -1;
    var epiboChar = hasEpibo ? state.selectedEpiboChar : null;
    var epiboKuroeCase = (hasEpibo && epiboChar === '黒江') ? state.selectedEpiboKuroeCase : null;
    if (state.editingEntryId) {
      var e = v.entries.find(function (x) { return x.id === state.editingEntryId; });
      e.game = game; e.point = point; e.atStartGame = atStartGame; e.startGame = startGame; e.results = results; e.mode = mode; e.atWin = atWin; e.atMemo = atMemo;
      e.bigVoice = bigVoice; e.bigScreen = bigScreen; e.atScreen = atScreen; e.bandColor = bandColor; e.bandBonus = bandBonus;
      e.embryoTriggers = embryoTriggers; e.embryoGameCount = embryoGameCount; e.embryoBellLevel = embryoBellLevel; e.embryoBonus = embryoBonus;
      e.embryoConnect = embryoConnect; e.embryoConnectBonus = embryoConnectBonus; e.embryoPattern = embryoPattern; e.weeChances = weeChances;
      e.storyOrderPattern = storyOrderPattern; e.doppelChances = doppelChances; e.cardCounts = cardCounts;
      e.epiboChar = epiboChar; e.epiboKuroeCase = epiboKuroeCase;
    } else {
      v.entries.push({
        id: uid(), game: game, point: point, atStartGame: atStartGame, startGame: startGame, results: results, mode: mode, atWin: atWin, atMemo: atMemo,
        bigVoice: bigVoice, bigScreen: bigScreen, atScreen: atScreen, bandColor: bandColor, bandBonus: bandBonus,
        embryoTriggers: embryoTriggers, embryoGameCount: embryoGameCount, embryoBellLevel: embryoBellLevel, embryoBonus: embryoBonus,
        embryoConnect: embryoConnect, embryoConnectBonus: embryoConnectBonus, embryoPattern: embryoPattern, weeChances: weeChances,
        storyOrderPattern: storyOrderPattern, doppelChances: doppelChances, cardCounts: cardCounts,
        epiboChar: epiboChar, epiboKuroeCase: epiboKuroeCase
      });
    }
    save();
    overlayEntry.classList.add('hidden');
    renderDetail();
  });
  eDeleteBtn.addEventListener('click', function () {
    var v = currentVisit();
    if (!confirm('この記録を削除しますか？')) return;
    v.entries = v.entries.filter(function (x) { return x.id !== state.editingEntryId; });
    save();
    overlayEntry.classList.add('hidden');
    renderDetail();
  });

  // --- FAB: 一覧では来店追加、詳細では記録追加 ---
  document.getElementById('btn-fab').addEventListener('click', function () {
    if (elDetailView.hidden) {
      openVisitSheet('new');
    } else {
      openEntrySheet(null);
    }
  });

  // --- バックアップ ---
  var overlayBackup = document.getElementById('overlay-backup');
  var syncCodeInput = document.getElementById('sync-code-input');
  document.getElementById('btn-backup').addEventListener('click', function () {
    syncCodeInput.value = syncCode || '';
    setSyncStatus(syncCode ? ('同期コード「' + syncCode + '」で同期中') : '同期は設定されていません');
    overlayBackup.classList.remove('hidden');
  });
  document.getElementById('backup-close').addEventListener('click', function () {
    overlayBackup.classList.add('hidden');
  });
  document.getElementById('btn-sync-start').addEventListener('click', function () {
    var code = syncCodeInput.value.trim();
    if (!code) { alert('同期コードを入力してください'); return; }
    startSync(code);
  });
  document.getElementById('btn-sync-stop').addEventListener('click', function () {
    if (!syncCode) return;
    if (confirm('同期を解除しますか?(記録はこの端末には残ります)')) {
      stopSync();
      syncCodeInput.value = '';
    }
  });
  document.getElementById('btn-export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state.visits, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'magireco-records-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btn-import-open').addEventListener('click', function () {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('invalid');
        if (confirm('現在の記録に読み込んだデータを追加します。よろしいですか？')) {
          state.visits = state.visits.concat(data);
          save();
          renderList();
          overlayBackup.classList.add('hidden');
        }
      } catch (e) {
        alert('JSONの読み込みに失敗しました。');
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  // モーダル(来店/記録/バックアップ)を開いている間、背景のスクロールを止める。
  // どれか1つでも開いていればロックし、全部閉じたら元のスクロール位置に戻す。
  var modalScrollY = 0;
  var modalLocked = false;
  function updateBodyScrollLock() {
    var anyOpen = !overlayVisit.classList.contains('hidden') ||
                  !overlayEntry.classList.contains('hidden') ||
                  !overlayPicker.classList.contains('hidden') ||
                  !overlayBackup.classList.contains('hidden');
    if (anyOpen && !modalLocked) {
      modalLocked = true;
      modalScrollY = window.scrollY;
      document.body.classList.add('modal-open');
      document.body.style.position = 'fixed';
      document.body.style.top = '-' + modalScrollY + 'px';
      document.body.style.width = '100%';
    } else if (!anyOpen && modalLocked) {
      modalLocked = false;
      document.body.classList.remove('modal-open');
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.width = '';
      window.scrollTo(0, modalScrollY);
    }
  }
  [overlayVisit, overlayEntry, overlayPicker, overlayBackup].forEach(function (el) {
    new MutationObserver(updateBodyScrollLock).observe(el, { attributes: true, attributeFilter: ['class'] });
  });

  // シート内の入力欄にフォーカスした時、キーボードに隠れないよう自動でスクロールする
  document.addEventListener('focusin', function (ev) {
    var el = ev.target;
    if (!el.matches('input, textarea, select')) return;
    if (!el.closest('.sheet')) return;
    setTimeout(function () {
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 300);
  });

  load();
  renderList();
})();
</script>
</body>
</html>
