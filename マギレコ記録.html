<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マギレコ記録">
<meta name="theme-color" content="#000000">
<title>マギレコ実戦記録</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #1c1c1e;
    --panel2: #2c2c2e;
    --border: #3a3a3c;
    --text: #f2f2f7;
    --sub: #9a9aa0;
    --accent: #ffd60a;
    --big: #ff6b6b;
    --reg: #6bb8ff;
    --charge: #b98bff;
    --at: #6bffb0;
    --memo: #9a9aa0;
    --danger: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 14px 90px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    flex: 1;
  }
  .icon-btn {
    background: var(--panel2);
    border: none;
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 15px;
    cursor: pointer;
  }
  .icon-btn:active { opacity: 0.6; }
  .primary-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .primary-btn:active { opacity: 0.7; }
  .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
  }

  /* 全体集計 */
  .summary {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary .card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .summary .card .label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .summary .card .value { font-size: 18px; font-weight: 700; }

  .search-row { margin-bottom: 12px; }
  .search-row input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
  }

  /* 来店カード一覧 */
  .visit-card {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .visit-card:active { opacity: 0.7; }
  .visit-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .visit-card .store { font-size: 17px; font-weight: 700; }
  .visit-card .date { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .visit-card .meta { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .visit-card .stats { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; }
  .visit-card .stats span b { color: var(--text); }

  .counters { display: flex; gap: 8px; margin-top: 10px; }
  .counter-card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--panel2);
    border-radius: 12px;
    padding: 8px 4px;
  }
  .counter-card .counter-label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; white-space: nowrap; }
  .counter-controls { display: flex; align-items: center; gap: 6px; }
  .counter-controls .counter-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 9px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    padding: 0;
  }
  .counter-controls .counter-btn:active { opacity: 0.6; }
  .counter-value { font-size: 18px; font-weight: 700; min-width: 20px; text-align: center; }

  .empty {
    text-align: center;
    color: var(--sub);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.8;
  }

  /* 詳細ビュー */
  .visit-header {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .visit-header .store { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .visit-header .sub { font-size: 13px; color: var(--sub); }
  .visit-header .actions { display: flex; gap: 8px; margin-top: 10px; }
  .visit-header .summary .card { padding: 8px 4px; }
  .visit-header .summary .label { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .visit-header .summary .value { font-size: 22px; }
  .visit-header .summary .card:nth-child(1) { background: rgba(255, 107, 107, 0.16); border: 1px solid rgba(255, 107, 107, 0.45); }
  .visit-header .summary .card:nth-child(1) .label,
  .visit-header .summary .card:nth-child(1) .value { color: var(--big); }
  .visit-header .summary .card:nth-child(2) { background: rgba(185, 139, 255, 0.16); border: 1px solid rgba(185, 139, 255, 0.45); }
  .visit-header .summary .card:nth-child(2) .label,
  .visit-header .summary .card:nth-child(2) .value { color: var(--charge); }
  .visit-header .summary .card:nth-child(3) { background: rgba(255, 214, 10, 0.14); border: 1px solid rgba(255, 214, 10, 0.45); }
  .visit-header .summary .card:nth-child(3) .label,
  .visit-header .summary .card:nth-child(3) .value { color: var(--accent); }
  .visit-header .summary .card:nth-child(4) { background: rgba(107, 255, 176, 0.14); border: 1px solid rgba(107, 255, 176, 0.45); }
  .visit-header .summary .card:nth-child(4) .label,
  .visit-header .summary .card:nth-child(4) .value { color: var(--at); }

  .visit-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .visit-game { flex-shrink: 0; text-align: right; white-space: nowrap; }
  .visit-game-label { font-size: 11px; color: var(--sub); }
  .visit-game-value { font-size: 24px; font-weight: 800; color: var(--text); margin-top: 2px; }

  .invest-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    background: var(--panel2);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .invest-rate {
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .invest-rate:active { opacity: 0.6; }
  .mini-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    padding: 0;
  }
  .mini-btn:active { opacity: 0.6; }
  .invest-count { font-size: 15px; font-weight: 700; min-width: 18px; text-align: center; }
  .invest-unit { font-size: 13px; color: var(--sub); flex-shrink: 0; }
  .invest-total {
    margin-left: auto;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .entry {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .entry .tag {
    flex-shrink: 0;
    width: 92px;
    box-sizing: border-box;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 4px;
    border-radius: 999px;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .tag.BIG { background: var(--big); }
  .tag.みたま { background: var(--charge); }
  .tag.マギチャレ当選 { background: var(--reg); }
  .tag.AT { background: var(--at); }
  .tag.メモ { background: var(--memo); color: #000; }
  .entry .tags { display: flex; flex-direction: column; gap: 4px; }
  .entry .body { flex: 1; min-width: 0; }
  .entry .nums { font-size: 15px; font-weight: 700; }
  .entry .mode { font-size: 13px; color: var(--accent); margin-top: 2px; }
  .entry .extra { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .entry .extra div { margin-top: 1px; word-break: break-word; }
  .entry .note { font-size: 13px; color: var(--sub); margin-top: 2px; word-break: break-word; }
  .entry .drag-handle {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--sub);
    font-size: 18px;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .entry.dragging {
    position: relative;
    z-index: 50;
    opacity: 0.9;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
  }

  .fab {
    position: fixed;
    right: max(20px, calc((100vw - 640px) / 2 + 20px));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-size: 28px;
    border: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 10;
  }
  .fab:active { opacity: 0.7; }

  /* モーダル */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-end;
    z-index: 100;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 14px; font-size: 17px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 44px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .cat-select { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-select button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .cat-select button.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .check-row input[type="checkbox"] { width: 20px; height: 20px; }
  .check-row label { margin: 0; font-size: 15px; color: var(--text); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .sheet-actions button { flex: 1; padding: 12px; font-size: 15px; }

  .backup-row { display: flex; gap: 8px; margin-top: 4px; }
  .backup-row button { flex: 1; }
  #import-file { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="view-list">
    <header>
      <h1>マギレコ実戦記録</h1>
      <button class="icon-btn" id="btn-backup">⋯</button>
    </header>

    <div class="summary">
      <div class="card"><div class="label">来店回数</div><div class="value" id="sum-visits">0</div></div>
      <div class="card"><div class="label">当り回数</div><div class="value" id="sum-hits">0</div></div>
      <div class="card"><div class="label">ポイント合計</div><div class="value" id="sum-point">0</div></div>
    </div>

    <div class="search-row">
      <input type="text" id="search" placeholder="店舗名で検索">
    </div>

    <div id="visit-list"></div>
    <div class="empty" id="empty-msg" hidden>まだ記録がありません。<br>右下の + から来店を追加しましょう。</div>
  </div>

  <div id="view-detail" hidden>
    <header>
      <button class="icon-btn" id="btn-back">← 一覧</button>
      <h1></h1>
      <button class="icon-btn" id="btn-edit-visit">編集</button>
    </header>

    <div class="visit-header">
      <div class="visit-top">
        <div class="visit-info">
          <div class="store" id="d-store"></div>
          <div class="sub" id="d-sub"></div>
        </div>
        <div class="visit-game">
          <div class="visit-game-label">総ゲーム数</div>
          <div class="visit-game-value" id="d-header-game">0G</div>
        </div>
      </div>
      <div class="sub" id="d-memo"></div>
      <div class="invest-row">
        <button type="button" class="invest-rate" id="d-invest-rate">46枚▾</button>
        <button type="button" class="mini-btn" id="d-invest-minus">−</button>
        <div class="invest-count" id="d-invest-count">0</div>
        <span class="invest-unit">本</span>
        <button type="button" class="mini-btn" id="d-invest-plus">＋</button>
        <div class="invest-total" id="d-invest-total">＝0枚</div>
      </div>
      <div class="summary" style="margin-top:10px;">
        <div class="card"><div class="label">BIG</div><div class="value" id="d-big">0</div></div>
        <div class="card"><div class="label">みたま</div><div class="value" id="d-mitama">0</div></div>
        <div class="card"><div class="label">合計</div><div class="value" id="d-total">0</div></div>
        <div class="card"><div class="label">at当選</div><div class="value" id="d-atwin">0</div></div>
      </div>
      <div class="counters">
        <div class="counter-card">
          <div class="counter-label">スイカ</div>
          <div class="counter-controls">
            <button type="button" class="counter-btn" id="d-suika-minus">−</button>
            <div class="counter-value" id="d-suika-value">0</div>
            <button type="button" class="counter-btn" id="d-suika-plus">＋</button>
          </div>
        </div>
        <div class="counter-card">
          <div class="counter-label">CZ</div>
          <div class="counter-controls">
            <button type="button" class="counter-btn" id="d-cz-minus">−</button>
            <div class="counter-value" id="d-cz-value">0</div>
            <button type="button" class="counter-btn" id="d-cz-plus">＋</button>
          </div>
        </div>
        <div class="counter-card">
          <div class="counter-label">CZ成功</div>
          <div class="counter-controls">
            <button type="button" class="counter-btn" id="d-czwin-minus">−</button>
            <div class="counter-value" id="d-czwin-value">0</div>
            <button type="button" class="counter-btn" id="d-czwin-plus">＋</button>
          </div>
        </div>
      </div>
    </div>

    <div id="entry-list"></div>
  </div>

  <button class="fab" id="btn-fab">+</button>
</div>

<!-- 来店 追加/編集 -->
<div class="overlay hidden" id="overlay-visit">
  <div class="sheet">
    <h2 id="visit-sheet-title">来店を追加</h2>
    <div class="field">
      <label>店舗名</label>
      <input type="text" id="v-store" list="store-list" placeholder="例: エスパス日拓秋葉原">
      <datalist id="store-list"></datalist>
    </div>
    <div class="row2">
      <div class="field">
        <label>日付</label>
        <input type="date" id="v-date">
      </div>
      <div class="field">
        <label>台番号</label>
        <input type="text" id="v-machine" placeholder="例: 2038">
      </div>
    </div>
    <div class="field">
      <label>メモ</label>
      <textarea id="v-note" placeholder="任意のメモ"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="ghost-btn" id="v-cancel">キャンセル</button>
      <button class="ghost-btn" id="v-delete" style="color:var(--danger);border-color:var(--danger);display:none;">来店を削除</button>
      <button class="primary-btn" id="v-save">保存</button>
    </div>
  </div>
</div>

<!-- 記録 追加/編集 -->
<div class="overlay hidden" id="overlay-entry">
  <div class="sheet">
    <h2 id="entry-sheet-title">記録を追加</h2>
    <div class="row2">
      <div class="field">
        <label>ゲーム数</label>
        <input type="number" inputmode="numeric" id="e-game" placeholder="例: 650">
      </div>
      <div class="field">
        <label>ポイント</label>
        <input type="number" inputmode="numeric" id="e-point" placeholder="例: 350">
      </div>
      <div class="field">
        <label>at初期ゲーム数</label>
        <input type="number" inputmode="numeric" id="e-at-start-game" placeholder="例: 0">
      </div>
    </div>
    <div class="field">
      <label>結果(複数選択可)</label>
      <div class="cat-select" id="e-result">
        <button type="button" data-v="BIG">BIG</button>
        <button type="button" data-v="みたま">みたま</button>
        <button type="button" data-v="マギチャレ当選">マギチャレ当選</button>
      </div>
    </div>
    <div class="field" id="field-big-voice" hidden>
      <label>ビッグ終了後のボイス</label>
      <div class="cat-select" id="e-big-voice">
        <button type="button" data-v="運命を変えたいなら〜">①運命を変えたいなら〜</button>
        <button type="button" data-v="この町で魔法少女は〜">②この町で魔法少女は〜</button>
        <button type="button" data-v="お姉ちゃんにはまだ誰かを〜">③お姉ちゃんにはまだ誰かを〜</button>
        <button type="button" data-v="お姉ちゃんが幸せを〜">④お姉ちゃんが幸せを〜</button>
        <button type="button" data-v="奇跡って〜">⑤奇跡って〜</button>
      </div>
    </div>
    <div class="field" id="field-big-screen" hidden>
      <label>ビッグ終了後の画面</label>
      <div class="cat-select" id="e-big-screen">
        <button type="button" data-v="いろは&フェリシア">いろは&フェリシア</button>
        <button type="button" data-v="いろは&さな">いろは&さな</button>
        <button type="button" data-v="いろは&やちよ&鶴乃">いろは&やちよ&鶴乃</button>
        <button type="button" data-v="いろは&やちよ&ももこチーム">いろは&やちよ&ももこチーム</button>
        <button type="button" data-v="水着みかづき荘">水着みかづき荘</button>
        <button type="button" data-v="2nd Seasonキービジュアル">2nd Seasonキービジュアル</button>
        <button type="button" data-v="1st Seasonキービジュアル">1st Seasonキービジュアル</button>
        <button type="button" data-v="小さいキュゥべえ">小さいキュゥべえ</button>
      </div>
    </div>
    <div class="field">
      <div class="check-row">
        <input type="checkbox" id="e-atwin">
        <label for="e-atwin">at当選</label>
      </div>
    </div>
    <div class="field" id="field-at-screen" hidden>
      <label>at終了後の画面</label>
      <div class="cat-select" id="e-at-screen">
        <button type="button" data-v="城背景">城背景</button>
        <button type="button" data-v="マギウスメンバー">マギウスメンバー</button>
        <button type="button" data-v="みかづき荘メンバー">みかづき荘メンバー</button>
        <button type="button" data-v="まどか&いろは">まどか&いろは</button>
      </div>
    </div>
    <div class="field">
      <label>魔法少女モード</label>
      <div class="cat-select" id="e-mode">
        <button type="button" data-v="いろはモード">いろはモード</button>
        <button type="button" data-v="やちよモード">やちよモード</button>
        <button type="button" data-v="鶴乃モード">鶴乃モード</button>
        <button type="button" data-v="フェリシアモード">フェリシアモード</button>
        <button type="button" data-v="さなモード">さなモード</button>
        <button type="button" data-v="黒江モード">黒江モード</button>
      </div>
    </div>
    <div class="field">
      <label>at中身のメモ</label>
      <textarea id="e-atmemo" placeholder="例: ストーリー4.1 / きゅうべえ会話 / 黒江モード? など"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="ghost-btn" id="e-cancel">キャンセル</button>
      <button class="ghost-btn" id="e-delete" style="color:var(--danger);border-color:var(--danger);display:none;">削除</button>
      <button class="primary-btn" id="e-save">保存</button>
    </div>
  </div>
</div>

<!-- バックアップ -->
<div class="overlay hidden" id="overlay-backup">
  <div class="sheet">
    <h2>バックアップ</h2>
    <div class="backup-row">
      <button class="ghost-btn" id="btn-export">JSONを書き出し</button>
      <button class="ghost-btn" id="btn-import-open">JSONを読み込み</button>
    </div>
    <input type="file" id="import-file" accept="application/json">
    <div class="sheet-actions">
      <button class="primary-btn" id="backup-close" style="flex:1;">閉じる</button>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'magireco.visits.v1';
  var state = { visits: [], currentVisitId: null, editingEntryId: null, editingVisitMode: null, selectedResults: [], selectedMode: null, selectedBigVoice: null, selectedBigScreen: null, selectedAtScreen: null };

  // 古い形式のデータを新形式(game/point/results[]/atWin/atMemo)に変換する
  // - 最も古い形式: cat/g/p/note
  // - ひとつ前の形式: game/point/result(単一の文字列)/atWin/atMemo
  function normalizeEntry(e) {
    if (Array.isArray(e.results)) return e;

    var results = [];
    if (e.result) {
      results = [e.result];
    } else if (e.cat === 'BIG' || e.cat === 'REG') {
      results = ['BIG'];
    } else if (e.cat === 'マギチャレ成功') {
      results = ['みたま'];
    }

    return {
      id: e.id,
      game: (e.game !== undefined) ? e.game : ((typeof e.g === 'number') ? e.g : null),
      point: (e.point !== undefined) ? e.point : ((typeof e.p === 'number') ? e.p : null),
      results: results,
      atWin: (e.atWin !== undefined) ? e.atWin : (e.cat === 'AT当選'),
      atMemo: (e.atMemo !== undefined) ? e.atMemo : (e.note || '')
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      state.visits = raw ? JSON.parse(raw) : [];
    } catch (e) {
      state.visits = [];
    }
    state.visits.forEach(function (v) {
      v.entries = (v.entries || []).map(normalizeEntry);
    });
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.visits));
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(s) {
    if (!s) return '';
    var p = s.split('-');
    return p.length === 3 ? p[0] + '/' + p[1] + '/' + p[2] : s;
  }
  function visitStats(visit) {
    var point = 0, hits = 0, big = 0, mitama = 0, atWin = 0, game = 0;
    (visit.entries || []).forEach(function (e) {
      if (typeof e.point === 'number') point += e.point;
      if (typeof e.game === 'number') game += e.game;
      if (e.results && e.results.length) hits++;
      if (e.results && e.results.indexOf('BIG') !== -1) big++;
      if (e.results && e.results.indexOf('みたま') !== -1) mitama++;
      if (e.atWin) atWin++;
    });
    return { point: point, hits: hits, count: (visit.entries || []).length, big: big, mitama: mitama, total: big + mitama, atWin: atWin, game: game };
  }

  // --- 要素参照 ---
  var elListView = document.getElementById('view-list');
  var elDetailView = document.getElementById('view-detail');
  var elVisitList = document.getElementById('visit-list');
  var elEmptyMsg = document.getElementById('empty-msg');
  var elSearch = document.getElementById('search');
  var elSumVisits = document.getElementById('sum-visits');
  var elSumHits = document.getElementById('sum-hits');
  var elSumPoint = document.getElementById('sum-point');

  function renderList() {
    var q = (elSearch.value || '').trim();
    var visits = state.visits.slice().sort(function (a, b) {
      return (b.date + b.createdAt).localeCompare(a.date + a.createdAt);
    });
    if (q) {
      visits = visits.filter(function (v) {
        return (v.store || '').indexOf(q) !== -1;
      });
    }

    var totalPoint = 0, totalHits = 0;
    state.visits.forEach(function (v) {
      var s = visitStats(v);
      totalPoint += s.point;
      totalHits += s.hits;
    });
    elSumVisits.textContent = state.visits.length;
    elSumHits.textContent = totalHits;
    elSumPoint.textContent = totalPoint;

    elVisitList.innerHTML = '';
    elEmptyMsg.hidden = state.visits.length > 0;

    visits.forEach(function (v) {
      var s = visitStats(v);
      var card = document.createElement('div');
      card.className = 'visit-card';
      card.innerHTML =
        '<div class="top-row"><div class="store"></div><div class="date"></div></div>' +
        '<div class="meta"></div>' +
        '<div class="stats">' +
          '<span>回数 <b class="c-count"></b></span>' +
          '<span>当り <b class="c-hits"></b></span>' +
          '<span>ポイント <b class="c-point"></b></span>' +
        '</div>';
      card.querySelector('.store').textContent = v.store || '(店舗名未設定)';
      card.querySelector('.date').textContent = fmtDate(v.date);
      card.querySelector('.meta').textContent = v.machine ? (v.machine + ' 番台') : '';
      card.querySelector('.c-count').textContent = s.count;
      card.querySelector('.c-hits').textContent = s.hits;
      card.querySelector('.c-point').textContent = s.point;
      card.addEventListener('click', function () { openDetail(v.id); });
      elVisitList.appendChild(card);
    });

    // 店舗名の候補
    var storeList = document.getElementById('store-list');
    var stores = Array.from(new Set(state.visits.map(function (v) { return v.store; }).filter(Boolean)));
    storeList.innerHTML = stores.map(function (s) { return '<option value="' + s.replace(/"/g, '') + '">'; }).join('');
  }

  elSearch.addEventListener('input', renderList);

  // --- 詳細ビュー ---
  var elDStore = document.getElementById('d-store');
  var elDSub = document.getElementById('d-sub');
  var elDMemo = document.getElementById('d-memo');
  var elDBig = document.getElementById('d-big');
  var elDMitama = document.getElementById('d-mitama');
  var elDTotal = document.getElementById('d-total');
  var elDAtWin = document.getElementById('d-atwin');
  var elDHeaderGame = document.getElementById('d-header-game');
  var elDSuikaValue = document.getElementById('d-suika-value');
  var elDCzValue = document.getElementById('d-cz-value');
  var elDCzWinValue = document.getElementById('d-czwin-value');
  var elDInvestRate = document.getElementById('d-invest-rate');
  var elDInvestCount = document.getElementById('d-invest-count');
  var elDInvestTotal = document.getElementById('d-invest-total');
  var elEntryList = document.getElementById('entry-list');

  // スイカ/CZ/CZ成功のタップカウンター(来店ごとに保持)
  function changeCounter(key, delta) {
    var v = currentVisit();
    if (!v) return;
    if (!v.counters) v.counters = { suika: 0, cz: 0, czWin: 0 };
    v.counters[key] = Math.max(0, (v.counters[key] || 0) + delta);
    save();
    renderDetail();
  }
  document.getElementById('d-suika-plus').addEventListener('click', function () { changeCounter('suika', 1); });
  document.getElementById('d-suika-minus').addEventListener('click', function () { changeCounter('suika', -1); });
  document.getElementById('d-cz-plus').addEventListener('click', function () { changeCounter('cz', 1); });
  document.getElementById('d-cz-minus').addEventListener('click', function () { changeCounter('cz', -1); });
  document.getElementById('d-czwin-plus').addEventListener('click', function () { changeCounter('czWin', 1); });
  document.getElementById('d-czwin-minus').addEventListener('click', function () { changeCounter('czWin', -1); });

  // 投資枚数(46枚or47枚 × 本数 = 総枚数)
  function changeInvestCount(delta) {
    var v = currentVisit();
    if (!v) return;
    if (!v.invest) v.invest = { rate: 46, count: 0 };
    v.invest.count = Math.max(0, (v.invest.count || 0) + delta);
    save();
    renderDetail();
  }
  document.getElementById('d-invest-rate').addEventListener('click', function () {
    var v = currentVisit();
    if (!v) return;
    if (!v.invest) v.invest = { rate: 46, count: 0 };
    v.invest.rate = (v.invest.rate === 46) ? 47 : 46;
    save();
    renderDetail();
  });
  document.getElementById('d-invest-plus').addEventListener('click', function () { changeInvestCount(1); });
  document.getElementById('d-invest-minus').addEventListener('click', function () { changeInvestCount(-1); });

  function currentVisit() {
    return state.visits.find(function (v) { return v.id === state.currentVisitId; });
  }

  function openDetail(id) {
    state.currentVisitId = id;
    elListView.hidden = true;
    elDetailView.hidden = false;
    renderDetail();
  }
  function closeDetail() {
    state.currentVisitId = null;
    elDetailView.hidden = true;
    elListView.hidden = false;
    renderList();
  }
  document.getElementById('btn-back').addEventListener('click', closeDetail);

  function renderDetail() {
    var v = currentVisit();
    if (!v) { closeDetail(); return; }
    elDStore.textContent = v.store || '(店舗名未設定)';
    elDSub.textContent = fmtDate(v.date) + (v.machine ? '　' + v.machine + ' 番台' : '');
    elDMemo.textContent = v.note || '';
    elDMemo.style.display = v.note ? '' : 'none';

    var s = visitStats(v);
    elDBig.textContent = s.big;
    elDMitama.textContent = s.mitama;
    elDTotal.textContent = s.total;
    elDAtWin.textContent = s.atWin;
    elDHeaderGame.textContent = s.game + 'G';

    var counters = v.counters || { suika: 0, cz: 0, czWin: 0 };
    elDSuikaValue.textContent = counters.suika || 0;
    elDCzValue.textContent = counters.cz || 0;
    elDCzWinValue.textContent = counters.czWin || 0;

    var invest = v.invest || { rate: 46, count: 0 };
    elDInvestRate.textContent = invest.rate + '枚▾';
    elDInvestCount.textContent = invest.count || 0;
    elDInvestTotal.textContent = '＝' + (invest.rate * (invest.count || 0)) + '枚';

    elEntryList.innerHTML = '';
    (v.entries || []).forEach(function (e, idx) {
      var row = document.createElement('div');
      row.className = 'entry';
      var gameText = (typeof e.game === 'number') ? e.game + 'G' : '';
      var pointText = (typeof e.point === 'number') ? e.point + 'pt' : '';
      var atStartGameText = (typeof e.atStartGame === 'number') ? 'at初期' + e.atStartGame + 'G' : '';
      var numsText = [gameText, pointText, atStartGameText].filter(Boolean).join(' / ');

      var tags = (e.results || []).map(function (r) {
        return '<span class="tag ' + r + '">' + r + '</span>';
      });
      if (e.atWin) tags.push('<span class="tag AT">at当選</span>');
      if (!tags.length) tags.push('<span class="tag メモ">メモ</span>');

      row.dataset.entryId = e.id;
      row.innerHTML =
        '<div class="tags">' + tags.join('') + '</div>' +
        '<div class="body">' +
          '<div class="nums"></div>' +
          '<div class="mode"></div>' +
          '<div class="extra"></div>' +
          '<div class="note"></div>' +
        '</div>' +
        '<button type="button" class="drag-handle">☰</button>';
      row.querySelector('.nums').textContent = numsText;
      row.querySelector('.nums').style.display = numsText ? '' : 'none';
      row.querySelector('.mode').textContent = e.mode || '';
      row.querySelector('.mode').style.display = e.mode ? '' : 'none';

      var extraContainer = row.querySelector('.extra');
      var extraLines = [];
      if (e.bigVoice) extraLines.push('ボイス: ' + e.bigVoice);
      if (e.bigScreen) extraLines.push('画面: ' + e.bigScreen);
      if (e.atScreen) extraLines.push('at画面: ' + e.atScreen);
      extraLines.forEach(function (text) {
        var lineDiv = document.createElement('div');
        lineDiv.textContent = text;
        extraContainer.appendChild(lineDiv);
      });
      extraContainer.style.display = extraLines.length ? '' : 'none';

      row.querySelector('.note').textContent = e.atMemo || '';
      row.querySelector('.note').style.display = e.atMemo ? '' : 'none';
      row.querySelector('.body').addEventListener('click', function () { openEntrySheet(e.id); });
      row.querySelector('.drag-handle').addEventListener('touchstart', function (ev) {
        startDrag(ev, v, e.id, row);
      }, { passive: false });
      elEntryList.appendChild(row);
    });
  }

  // 記録の並び順を1つ前後に入れ替える(direction: -1で上へ、+1で下へ)
  // ハンドルを「タップ」すると削除、「ドラッグ」すると並び替え。
  // タップとドラッグは指の移動量で区別する。
  var dragState = null;
  var DRAG_THRESHOLD = 8;

  function startDrag(ev, visit, entryId, rowEl) {
    if (ev.touches.length !== 1) return;
    var touch = ev.touches[0];
    var rects = Array.prototype.map.call(elEntryList.children, function (child) {
      var r = child.getBoundingClientRect();
      return { id: child.dataset.entryId, top: r.top, bottom: r.bottom };
    });
    dragState = { visit: visit, entryId: entryId, rowEl: rowEl, startY: touch.clientY, moved: false, rects: rects };
    rowEl.classList.add('dragging');
    ev.preventDefault();
  }

  document.addEventListener('touchmove', function (ev) {
    if (!dragState) return;
    var touch = ev.touches[0];
    var deltaY = touch.clientY - dragState.startY;
    if (Math.abs(deltaY) > DRAG_THRESHOLD) dragState.moved = true;
    dragState.rowEl.style.transform = 'translateY(' + deltaY + 'px)';
    ev.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function (ev) {
    if (!dragState) return;
    var ds = dragState;
    dragState = null;
    ds.rowEl.classList.remove('dragging');
    ds.rowEl.style.transform = '';

    if (!ds.moved) {
      // 指をほぼ動かさなかった = タップとみなして削除確認を出す
      if (confirm('この記録を削除しますか？')) {
        ds.visit.entries = ds.visit.entries.filter(function (x) { return x.id !== ds.entryId; });
        save();
      }
      renderDetail();
      return;
    }

    var touch = ev.changedTouches[0];
    var others = ds.rects.filter(function (r) { return r.id !== ds.entryId; });
    var targetIndex = 0;
    others.forEach(function (r) {
      var center = (r.top + r.bottom) / 2;
      if (touch.clientY > center) targetIndex++;
    });
    var draggedEntry = ds.visit.entries.find(function (x) { return x.id === ds.entryId; });
    var rest = ds.visit.entries.filter(function (x) { return x.id !== ds.entryId; });
    rest.splice(targetIndex, 0, draggedEntry);
    ds.visit.entries = rest;
    save();
    renderDetail();
  });

  document.addEventListener('touchcancel', function () {
    if (!dragState) return;
    dragState.rowEl.classList.remove('dragging');
    dragState.rowEl.style.transform = '';
    dragState = null;
  });

  // --- 来店 追加/編集シート ---
  var overlayVisit = document.getElementById('overlay-visit');
  var vStore = document.getElementById('v-store');
  var vDate = document.getElementById('v-date');
  var vMachine = document.getElementById('v-machine');
  var vNote = document.getElementById('v-note');
  var vDeleteBtn = document.getElementById('v-delete');

  function openVisitSheet(mode) {
    state.editingVisitMode = mode; // 'new' or 'edit'
    var title = document.getElementById('visit-sheet-title');
    if (mode === 'new') {
      title.textContent = '来店を追加';
      vStore.value = '';
      vDate.value = todayStr();
      vMachine.value = '';
      vNote.value = '';
      vDeleteBtn.style.display = 'none';
    } else {
      var v = currentVisit();
      title.textContent = '来店を編集';
      vStore.value = v.store || '';
      vDate.value = v.date || todayStr();
      vMachine.value = v.machine || '';
      vNote.value = v.note || '';
      vDeleteBtn.style.display = '';
    }
    overlayVisit.classList.remove('hidden');
  }
  document.getElementById('v-cancel').addEventListener('click', function () {
    overlayVisit.classList.add('hidden');
  });
  document.getElementById('v-save').addEventListener('click', function () {
    var store = vStore.value.trim();
    var date = vDate.value || todayStr();
    var machine = vMachine.value.trim();
    var note = vNote.value.trim();
    if (state.editingVisitMode === 'new') {
      var v = { id: uid(), store: store, date: date, machine: machine, note: note, createdAt: Date.now().toString(), entries: [], counters: { suika: 0, cz: 0, czWin: 0 }, invest: { rate: 46, count: 0 } };
      state.visits.push(v);
      save();
      overlayVisit.classList.add('hidden');
      openDetail(v.id);
    } else {
      var cv = currentVisit();
      cv.store = store; cv.date = date; cv.machine = machine; cv.note = note;
      save();
      overlayVisit.classList.add('hidden');
      renderDetail();
    }
  });
  vDeleteBtn.addEventListener('click', function () {
    if (!confirm('この来店記録をすべて削除しますか？')) return;
    state.visits = state.visits.filter(function (v) { return v.id !== state.currentVisitId; });
    save();
    overlayVisit.classList.add('hidden');
    closeDetail();
  });
  document.getElementById('btn-edit-visit').addEventListener('click', function () {
    if (currentVisit()) openVisitSheet('edit');
  });

  // --- 記録 追加/編集シート ---
  var overlayEntry = document.getElementById('overlay-entry');
  var eGame = document.getElementById('e-game');
  var ePoint = document.getElementById('e-point');
  var eAtStartGame = document.getElementById('e-at-start-game');
  var eAtWin = document.getElementById('e-atwin');
  var eAtMemo = document.getElementById('e-atmemo');
  var eDeleteBtn = document.getElementById('e-delete');
  var resultButtons = document.querySelectorAll('#e-result button');

  // BIGが選ばれている間だけビッグ関連、at当選がONの間だけat終了画面の項目を表示する
  var fieldBigVoice = document.getElementById('field-big-voice');
  var fieldBigScreen = document.getElementById('field-big-screen');
  var fieldAtScreen = document.getElementById('field-at-screen');
  function updateConditionalFields() {
    var hasBig = state.selectedResults.indexOf('BIG') !== -1;
    fieldBigVoice.hidden = !hasBig;
    fieldBigScreen.hidden = !hasBig;
    fieldAtScreen.hidden = !eAtWin.checked;
  }

  resultButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      // BIG/みたま/マギチャレ当選はそれぞれ独立してON/OFFできる(同時選択OK)
      var v = btn.dataset.v;
      var idx = state.selectedResults.indexOf(v);
      if (idx === -1) {
        state.selectedResults.push(v);
      } else {
        state.selectedResults.splice(idx, 1);
      }
      btn.classList.toggle('active', state.selectedResults.indexOf(v) !== -1);
      updateConditionalFields();
    });
  });

  eAtWin.addEventListener('change', updateConditionalFields);

  var modeButtons = document.querySelectorAll('#e-mode button');
  modeButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      // 魔法少女モードは1つだけ選択(もう一度押すと選択解除)
      state.selectedMode = (state.selectedMode === btn.dataset.v) ? null : btn.dataset.v;
      modeButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedMode); });
    });
  });

  // 単一選択(もう一度押すと選択解除)のボタングループを作る共通ヘルパー
  function setupSingleSelect(selector, stateKey) {
    var buttons = document.querySelectorAll(selector);
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state[stateKey] = (state[stateKey] === btn.dataset.v) ? null : btn.dataset.v;
        buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state[stateKey]); });
      });
    });
    return buttons;
  }
  var bigVoiceButtons = setupSingleSelect('#e-big-voice button', 'selectedBigVoice');
  var bigScreenButtons = setupSingleSelect('#e-big-screen button', 'selectedBigScreen');
  var atScreenButtons = setupSingleSelect('#e-at-screen button', 'selectedAtScreen');

  function openEntrySheet(entryId) {
    state.editingEntryId = entryId || null;
    var title = document.getElementById('entry-sheet-title');
    if (entryId) {
      var v = currentVisit();
      var e = v.entries.find(function (x) { return x.id === entryId; });
      title.textContent = '記録を編集';
      state.selectedResults = (e.results || []).slice();
      state.selectedMode = e.mode || null;
      state.selectedBigVoice = e.bigVoice || null;
      state.selectedBigScreen = e.bigScreen || null;
      state.selectedAtScreen = e.atScreen || null;
      eGame.value = (typeof e.game === 'number') ? e.game : '';
      ePoint.value = (typeof e.point === 'number') ? e.point : '';
      eAtStartGame.value = (typeof e.atStartGame === 'number') ? e.atStartGame : '';
      eAtWin.checked = !!e.atWin;
      eAtMemo.value = e.atMemo || '';
      eDeleteBtn.style.display = '';
    } else {
      title.textContent = '記録を追加';
      state.selectedResults = [];
      state.selectedMode = null;
      state.selectedBigVoice = null;
      state.selectedBigScreen = null;
      state.selectedAtScreen = null;
      eGame.value = '';
      ePoint.value = '';
      eAtStartGame.value = '';
      eAtWin.checked = false;
      eAtMemo.value = '';
      eDeleteBtn.style.display = 'none';
    }
    resultButtons.forEach(function (b) { b.classList.toggle('active', state.selectedResults.indexOf(b.dataset.v) !== -1); });
    modeButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedMode); });
    bigVoiceButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedBigVoice); });
    bigScreenButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedBigScreen); });
    atScreenButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.v === state.selectedAtScreen); });
    updateConditionalFields();
    overlayEntry.classList.remove('hidden');
  }
  document.getElementById('e-cancel').addEventListener('click', function () {
    overlayEntry.classList.add('hidden');
  });
  document.getElementById('e-save').addEventListener('click', function () {
    var v = currentVisit();
    if (!v) return;
    var game = eGame.value === '' ? null : Number(eGame.value);
    var point = ePoint.value === '' ? null : Number(ePoint.value);
    var atStartGame = eAtStartGame.value === '' ? null : Number(eAtStartGame.value);
    var results = state.selectedResults.slice();
    var mode = state.selectedMode;
    var atWin = eAtWin.checked;
    var atMemo = eAtMemo.value.trim();
    // BIGが選ばれていない/at当選がOFFの時は、関連する選択を保存しない(表示と矛盾しないように)
    var hasBig = results.indexOf('BIG') !== -1;
    var bigVoice = hasBig ? state.selectedBigVoice : null;
    var bigScreen = hasBig ? state.selectedBigScreen : null;
    var atScreen = atWin ? state.selectedAtScreen : null;
    if (state.editingEntryId) {
      var e = v.entries.find(function (x) { return x.id === state.editingEntryId; });
      e.game = game; e.point = point; e.atStartGame = atStartGame; e.results = results; e.mode = mode; e.atWin = atWin; e.atMemo = atMemo;
      e.bigVoice = bigVoice; e.bigScreen = bigScreen; e.atScreen = atScreen;
    } else {
      v.entries.push({ id: uid(), game: game, point: point, atStartGame: atStartGame, results: results, mode: mode, atWin: atWin, atMemo: atMemo, bigVoice: bigVoice, bigScreen: bigScreen, atScreen: atScreen });
    }
    save();
    overlayEntry.classList.add('hidden');
    renderDetail();
  });
  eDeleteBtn.addEventListener('click', function () {
    var v = currentVisit();
    if (!confirm('この記録を削除しますか？')) return;
    v.entries = v.entries.filter(function (x) { return x.id !== state.editingEntryId; });
    save();
    overlayEntry.classList.add('hidden');
    renderDetail();
  });

  // --- FAB: 一覧では来店追加、詳細では記録追加 ---
  document.getElementById('btn-fab').addEventListener('click', function () {
    if (elDetailView.hidden) {
      openVisitSheet('new');
    } else {
      openEntrySheet(null);
    }
  });

  // --- バックアップ ---
  var overlayBackup = document.getElementById('overlay-backup');
  document.getElementById('btn-backup').addEventListener('click', function () {
    overlayBackup.classList.remove('hidden');
  });
  document.getElementById('backup-close').addEventListener('click', function () {
    overlayBackup.classList.add('hidden');
  });
  document.getElementById('btn-export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state.visits, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'magireco-records-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btn-import-open').addEventListener('click', function () {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('invalid');
        if (confirm('現在の記録に読み込んだデータを追加します。よろしいですか？')) {
          state.visits = state.visits.concat(data);
          save();
          renderList();
          overlayBackup.classList.add('hidden');
        }
      } catch (e) {
        alert('JSONの読み込みに失敗しました。');
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  load();
  renderList();
})();
</script>
</body>
</html>
